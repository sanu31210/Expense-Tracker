<style>

  }
  .month-nav button:active { background: rgba(239,237,228,0.2); }
  .month-label { font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(239,237,228,0.75); }
  .hero-label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(239,237,228,0.6); margin-bottom: 4px; }
  .hero-amount { font-size: 40px; font-weight: 500; line-height: 1; }
  .hero-amount.neg { color: var(--brick-soft); }
  .hero-sub { display: flex; gap: 18px; margin-top: 14px; font-size: 13px; }
  .hero-sub div span:first-child { display: block; color: rgba(239,237,228,0.55); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 2px; }
  .hero-sub div span:first-child::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  .hero-sub div.stat-expense span:first-child::before { background: var(--brick-soft); }
  .hero-sub div.stat-income span:first-child::before { background: var(--forest-soft); }

  .section-title {
    font-family: "Fraunces", Georgia, serif; font-size: 15px; font-weight: 600;
    margin: 0 0 10px; display: flex; align-items: center; justify-content: space-between;
  }
  .section-title .link {

    color: var(--forest); cursor: pointer; text-transform: uppercase; letter-spacing: 0.04em;

  .card { background: var(--paper-raised); border: 1px solid var(--rule); border-radius: 4px; padding: 14px 16px; margin-bottom: 20px; }

  .row { display: flex; align-items: baseline; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--rule); }

  .empty { text-align: center; padding: 32px 16px; color: var(--slate); }
  .empty-title { font-family: "Fraunces", Georgia, serif; font-size: 16px; color: var(--ink); margin-bottom: 4px; }

  .tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--slate); }

  .nav {
    position: sticky; bottom: 0; background: var(--paper-raised); border-top: 1px solid var(--rule);

  .nav-btn {
    flex: 1; background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 6px 0; color: var(--slate); cursor: pointer; font-size: 10px; letter-spacing: 0.03em; text-transform: uppercase;
  }
  .nav-btn.active { color: var(--forest); }
  .nav-btn svg { width: 19px; height: 19px; }

  .fab {
    position: fixed; right: calc(18px + (100vw - 480px) / 2); bottom: calc(78px + env(safe-area-inset-bottom));
    width: 52px; height: 52px; border-radius: 50%; background: var(--forest); color: var(--paper-raised);
    border: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 14px rgba(28,31,26,0.28);
    cursor: pointer; z-index: 5;
  }
  @media (max-width: 480px) { .fab { right: 18px; } }
  .fab:active { background: #244A38; }
  .fab svg { width: 24px; height: 24px; flex-shrink: 0; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(28,31,26,0.5); display: flex; align-items: flex-end; z-index: 20; }
  .modal {
    background: var(--paper); width: 100%; max-width: 480px; margin: 0 auto; border-radius: 12px 12px 0 0;
    padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); max-height: 88vh; overflow-y: auto;
  }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .modal-title { font-family: "Fraunces", Georgia, serif; font-size: 18px; font-weight: 600; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--slate); margin-bottom: 5px; }
  .field input, .field select {
    width: 100%; border: 1px solid var(--rule); background: var(--paper-raised); border-radius: 4px;
    padding: 10px 11px; font-size: 14px; font-family: "IBM Plex Sans", sans-serif; color: var(--ink);
  }
  .field input.mono { font-family: "IBM Plex Mono", monospace; }
  .type-toggle { display: flex; gap: 8px; }
  .type-toggle button { flex: 1; padding: 9px; border: 1px solid var(--rule); background: var(--paper-raised); border-radius: 4px; font-size: 13px; cursor: pointer; color: var(--ink-soft); }
  .type-toggle button.active.expense { background: var(--brick); border-color: var(--brick); color: var(--paper-raised); }
  .type-toggle button.active.income { background: var(--forest); border-color: var(--forest); color: var(--paper-raised); }
  .cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .cat-chip { border: 1px solid var(--rule); background: var(--paper-raised); border-radius: 4px; padding: 8px 4px; font-size: 10.5px; text-align: center; cursor: pointer; color: var(--ink-soft); line-height: 1.25; }

  .submit-btn { width: 100%; background: var(--ink); color: var(--paper); border: none; border-radius: 4px; padding: 13px; font-size: 14px; font-weight: 500; margin-top: 6px; cursor: pointer; }

  .chart-wrap { display: flex; align-items: center; gap: 16px; }

  .legend-left { display: flex; align-items: center; gap: 6px; }

  .boot-loading {
    min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    color: var(--paper); background: var(--ink); font-size: 13px; letter-spacing: 0.05em; text-transform: uppercase;
  }
  .signin-wrap {
    min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--ink); color: var(--paper); padding: 32px 28px; text-align: center;
  }
  .signin-mark {
    width: 56px; height: 56px; border-radius: 50%; border: 1.5px solid var(--brass);
    display: flex; align-items: center; justify-content: center; font-family: "IBM Plex Mono", monospace;
    font-size: 24px; margin-bottom: 18px; color: var(--paper);
  }
  .signin-title { font-family: "Fraunces", Georgia, serif; font-size: 24px; font-weight: 600; margin-bottom: 8px; }
  .signin-sub { font-size: 13px; color: rgba(239,237,228,0.6); margin-bottom: 30px; max-width: 280px; line-height: 1.5; }
  .google-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: var(--paper-raised); color: var(--ink); border: none; border-radius: 4px;
    padding: 13px 22px; font-size: 14px; font-weight: 500; cursor: pointer; width: 100%; max-width: 280px;
  }
  .google-btn:active { background: #E9E6DA; }
  .signin-note { font-size: 11px; color: rgba(239,237,228,0.4); margin-top: 22px; max-width: 280px; line-height: 1.5; }
  .setup-divider { font-size: 11px; color: rgba(239,237,228,0.45); margin: 18px 0 12px; text-transform: uppercase; letter-spacing: 0.05em; }
  .join-code-input {
    width: 100%; max-width: 280px; text-align: center; letter-spacing: 0.2em; font-size: 18px;
    border: 1px solid rgba(239,237,228,0.25); background: rgba(239,237,228,0.06); color: var(--paper);
    border-radius: 4px; padding: 12px; text-transform: uppercase;
  }
  .join-code-input::placeholder { color: rgba(239,237,228,0.3); letter-spacing: 0.2em; }
  .setup-error { font-size: 12px; color: var(--brick-soft); margin-top: 14px; max-width: 280px; line-height: 1.4; }
  .topbar {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;
    font-size: 11px; color: var(--slate);
  }
  .topbar .link { color: var(--forest); font-weight: 500; cursor: pointer; text-transform: uppercase; letter-spacing: 0.04em; font-size: 11px; }
  .build-tag { font-size: 10px; color: var(--slate); text-align: right; margin: 6px 0 12px; opacity: 0.7; }
  .household-tag { font-size: 11px; color: var(--slate); margin: -6px 0 4px; display: flex; gap: 10px; align-items: baseline; }
  .household-tag b { color: var(--ink); font-weight: 600; letter-spacing: 0.05em; }
  .household-tag .link { color: var(--forest); cursor: pointer; font-weight: 500; text-transform: uppercase; font-size: 10px; letter-spacing: 0.03em; }
  .sync-note { font-size: 10px; color: var(--slate); text-align: center; padding: 4px 0 0; }
</style>

<body>
<div id="app"><div class="boot-loading">Loading…</div></div>

<script>
/* =====================================================================
   FIREBASE SETUP — replace with YOUR OWN project's config.
   Get this from: Firebase console → Project settings → General →
   "Your apps" → Web app → SDK setup and configuration → Config.
   These values are safe to keep in public client-side code; access is
   controlled by the Firestore security rules, not by hiding this config.
===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyCi-Ot9bKDEQ339DYdQnfRGl--ZSDpItsk",
  authDomain: "ledger-app-c192f.firebaseapp.com",
  projectId: "ledger-app-c192f",
  storageBucket: "ledger-app-c192f.firebasestorage.app",
  messagingSenderId: "514451745153",
  appId: "1:514451745153:web:ac3610af81bd9ef1566080"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
try { db.enablePersistence({ synchronizeTabs: true }); } catch (e) {}

let currentUser = null;
let unsubscribeSnapshot = null;
let cloudSyncStatus = "idle"; // idle | syncing | synced | error
let householdId = null;
let householdLoading = true;
let householdError = "";
let joinCodeInput = "";

/* Bump this string every time you deploy a code change — it's shown in the
   app so you can visually confirm a device has picked up the latest version
   instead of a stale cached copy. Any format works, e.g. a date or date+letter. */
const APP_BUILD = "2026-07-21 categories-reports";

/* ---------- Data ---------- */
const STORAGE_KEY = "expense-tracker-ledger-v1";
const DEFAULT_CATEGORIES = [
  { id: "groceries",     name: "Groceries",              color: "#16A34A" },
  { id: "food",          name: "Food & Dining",          color: "#F97316" },
  { id: "transport",     name: "Transport & Fuel",       color: "#0EA5E9" },
  { id: "rent",          name: "Rent / EMI",             color: "#6366F1" },
  { id: "utilities",     name: "Utilities & Bills",      color: "#0891B2" },
  { id: "mobile",        name: "Mobile & Internet",      color: "#3B82F6" },
  { id: "entertainment", name: "Entertainment & Subs",   color: "#D946EF" },
  { id: "health",        name: "Health & Medical",       color: "#EF4444" },
  { id: "insurance",     name: "Insurance",              color: "#10B981" },
  { id: "education",     name: "Education",              color: "#14B8A6" },
  { id: "personalcare",  name: "Personal Care",          color: "#A855F7" },
  { id: "shopping",      name: "Shopping & Clothing",    color: "#F59E0B" },
  { id: "electronics",   name: "Electronics & Gadgets",  color: "#06B6D4" },
  { id: "travel",        name: "Travel",                 color: "#8B5CF6" },
  { id: "gifts",         name: "Gifts & Donations",      color: "#EC4899" },
  { id: "investments",   name: "Investments & Savings",  color: "#CA8A04" },
  { id: "family",        name: "Family & Kids",          color: "#EAB308" },
  { id: "pets",          name: "Pets",                   color: "#84CC16" },
  { id: "household",     name: "Household & Maintenance",color: "#C2410C" },
  { id: "other",         name: "Other",                  color: "#64748B" },
];

let data = loadLocalCache();
let ui = {
  tab: "overview",
  selectedMonth: monthKey(todayISO()),
  showAddTxn: false,
  showAddRecurring: false,
  editingTxnId: null,
  reportView: "daily", // daily | monthly
  txnDraft: { type: "expense", amount: "", category: DEFAULT_CATEGORIES[0].id, note: "", date: todayISO() },
  recurringDraft: { name: "", amount: "", category: DEFAULT_CATEGORIES[0].id, day: "1" },
};
let donutChart = null, trendChart = null, splitChart = null, reportsChart = null;

function loadLocalCache() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return { categories: DEFAULT_CATEGORIES, transactions: [], budgets: {}, recurring: [], ...JSON.parse(raw) };
  } catch (e) {}
  return { categories: DEFAULT_CATEGORIES, transactions: [], budgets: {}, recurring: [] };
}
function saveLocalCache() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
  catch (e) { console.error("Could not save local cache:", e); }
}

/* ---------- Cloud sync (Firestore) — now backed by a SHARED household doc ---------- */
function householdDocRef() {
  return db.collection("households").doc(householdId);
}
function ledgerDocRef() {
  return householdDocRef().collection("ledger").doc("data");
}

function subscribeCloud() {
  if (unsubscribeSnapshot) unsubscribeSnapshot();
  cloudSyncStatus = "syncing"; render();
  unsubscribeSnapshot = ledgerDocRef().onSnapshot(
    (snap) => {
      if (snap.exists) {
        const d = snap.data();
        data = { categories: DEFAULT_CATEGORIES, transactions: d.transactions || [], budgets: d.budgets || {}, recurring: d.recurring || [] };
      } else {
        ledgerDocRef().set({ transactions: data.transactions, budgets: data.budgets, recurring: data.recurring }).catch(() => {});
      }
      cloudSyncStatus = "synced";
      saveLocalCache();
      render();
    },
    (err) => {
      console.error("Sync error:", err);
      cloudSyncStatus = "error";
      render();
    }
  );
}
let pushTimer = null;
function pushCloud() {
  saveLocalCache();
  if (!currentUser || !householdId) return;
  cloudSyncStatus = "syncing";
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => {
    ledgerDocRef()
      .set({ transactions: data.transactions, budgets: data.budgets, recurring: data.recurring })
      .then(() => { cloudSyncStatus = "synced"; render(); })
      .catch((e) => { console.error("Sync error:", e); cloudSyncStatus = "error"; render(); });
  }, 400);
}

/* ---------- Household (shared ledger) setup ---------- */
function genHouseholdCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no O/0 or I/1 — avoids ambiguity when read aloud/typed
  let code = "";
  for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}

async function initUserAndHousehold() {
  householdLoading = true; render();
  try {
    const userSnap = await db.collection("users").doc(currentUser.uid).get();
    const existingHouseholdId = userSnap.exists ? userSnap.data().householdId : null;
    if (existingHouseholdId) {
      householdId = existingHouseholdId;
      householdLoading = false;
      subscribeCloud();
      render();
    } else {
      householdLoading = false;
      render(); // shows the "create or join" screen
    }
  } catch (e) {
    console.error("Could not load profile:", e);
    householdLoading = false;
    render();
  }
}

async function createHousehold() {
  if (!currentUser) return;
  householdError = "";
  const code = genHouseholdCode();
  try {
    // Seed the new shared ledger with whatever's already on this device/account
    await db.collection("households").doc(code).set({
      ownerUid: currentUser.uid,
      memberUids: [currentUser.uid],
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    await db.collection("households").doc(code).collection("ledger").doc("data").set({
      transactions: data.transactions, budgets: data.budgets, recurring: data.recurring,
    });
    await db.collection("users").doc(currentUser.uid).set({ householdId: code }, { merge: true });
    householdId = code;
    subscribeCloud();
    render();
  } catch (e) {
    console.error("Could not create shared ledger:", e);
    householdError = "Something went wrong creating the shared ledger. Please try again.";
    render();
  }
}

async function joinHousehold(rawCode) {
  if (!currentUser) return;
  const code = (rawCode || "").trim().toUpperCase();
  householdError = "";
  if (!code) { householdError = "Enter the code your partner shared with you."; render(); return; }
  try {
    const ref = db.collection("households").doc(code);
    const snap = await ref.get();
    if (!snap.exists) {
      householdError = "That code doesn't match any shared ledger. Double-check it with your partner.";
      render();
      return;
    }
    await ref.update({
      memberUids: firebase.firestore.FieldValue.arrayUnion(currentUser.uid),
    });
    await db.collection("users").doc(currentUser.uid).set({ householdId: code }, { merge: true });
    householdId = code;
    subscribeCloud();
    render();
  } catch (e) {
    console.error("Could not join shared ledger:", e);
    householdError = "Couldn't join that ledger. Please try again.";
    render();
  }
}

function updateJoinCodeInput(val) { joinCodeInput = val; }

function copyHouseholdCode() {
  if (!householdId) return;
  navigator.clipboard?.writeText(householdId).then(
    () => alert("Code copied: " + householdId),
    () => alert("Your code is: " + householdId)
  );
}

function leaveHousehold() {
  if (!householdId || !currentUser) return;
  if (!confirm("Leave this shared ledger? You'll stop seeing its expenses, and can create or join a different one.")) return;
  const ref = db.collection("households").doc(householdId);
  ref.update({ memberUids: firebase.firestore.FieldValue.arrayRemove(currentUser.uid) }).catch(() => {});
  db.collection("users").doc(currentUser.uid).set({ householdId: firebase.firestore.FieldValue.delete() }, { merge: true }).catch(() => {});
  if (unsubscribeSnapshot) { unsubscribeSnapshot(); unsubscribeSnapshot = null; }
  householdId = null;
  data = { categories: DEFAULT_CATEGORIES, transactions: [], budgets: {}, recurring: [] };
  render();
}

/* ---------- Helpers ---------- */
function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function monthKey(dateStr) { return dateStr.slice(0,7); }
function fmt(n) {
  const val = Number.isFinite(n) ? n : 0;
  return new Intl.NumberFormat("en-IN", { style: "currency", currency: "INR", maximumFractionDigits: 0 }).format(val);
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function monthLabel(key) {
  const [y,m] = key.split("-").map(Number);
  return new Date(y, m-1, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" });
}
function shortMonthLabel(key) {
  const [y,m] = key.split("-").map(Number);
  return new Date(y, m-1, 1).toLocaleDateString("en-US", { month: "short" });
}
function dayLabel(dateStr) {
  const [y,m,d] = dateStr.split("-").map(Number);
  return new Date(y, m-1, d).toLocaleDateString("en-US", { weekday: "short", day: "numeric", month: "short" });
}
function shiftMonth(key, delta) {
  const [y,m] = key.split("-").map(Number);
  const d = new Date(y, m-1+delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}
function lastNMonthKeys(n, endKey) {
  const out = []; let k = endKey;
  for (let i=0;i<n;i++) { out.unshift(k); k = shiftMonth(k,-1); }
  return out;
}
function nextDueDate(day) {
  const now = new Date();
  const thisMonth = new Date(now.getFullYear(), now.getMonth(), day);
  if (thisMonth >= new Date(now.getFullYear(), now.getMonth(), now.getDate())) return thisMonth;
  return new Date(now.getFullYear(), now.getMonth()+1, day);
}
function catById(id) { return data.categories.find(c => c.id === id); }
function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }

/* ---------- Derived state ---------- */
function getMonthTxns(monthK) { return data.transactions.filter(t => monthKey(t.date) === monthK); }
function getCategorySpend(monthK) {
  const txns = getMonthTxns(monthK).filter(t => t.type === "expense");
  const map = {};
  txns.forEach(t => { map[t.category] = (map[t.category]||0) + t.amount; });
  return data.categories
    .map(c => ({ id: c.id, name: c.name, color: c.color, value: map[c.id]||0 }))
    .filter(c => c.value > 0)
    .sort((a,b) => b.value - a.value);
}
function getTrendData(monthK) {
  const keys = lastNMonthKeys(6, monthK);
  return keys.map(k => {
    const total = data.transactions.filter(t => t.type === "expense" && monthKey(t.date) === k).reduce((s,t)=>s+t.amount,0);
    return { month: shortMonthLabel(k), total };
  });
}
function getDailyReport(monthK) {
  const map = {}; // date -> { spent, income }
  getMonthTxns(monthK).forEach(t => {
    if (!map[t.date]) map[t.date] = { spent: 0, income: 0 };
    if (t.type === "expense") map[t.date].spent += t.amount;
    else map[t.date].income += t.amount;
  });
  return Object.keys(map)
    .sort((a,b) => a < b ? 1 : -1)
    .map(date => ({ date, ...map[date], net: map[date].income - map[date].spent }));
}
function getMonthlyReport(n, endKey) {
  const keys = lastNMonthKeys(n, endKey);
  return keys.map(k => {
    const txns = data.transactions.filter(t => monthKey(t.date) === k);
    const spentM = txns.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0);
    const incomeM = txns.filter(t=>t.type==="income").reduce((s,t)=>s+t.amount,0);
    return { key: k, label: monthLabel(k), short: shortMonthLabel(k), spent: spentM, income: incomeM, net: incomeM - spentM };
  }).reverse(); // most recent first for the list
}
function setReportView(v) { ui.reportView = v; render(); }
function isPaidThisRealMonth(recurringId) {
  const cur = monthKey(todayISO());
  return data.transactions.some(t => t.recurringId === recurringId && monthKey(t.date) === cur);
}

/* ---------- Mutations ---------- */
function addTransaction(txn) { data.transactions.push({ id: uid(), ...txn }); pushCloud(); }
function deleteTransaction(id) { data.transactions = data.transactions.filter(t => t.id !== id); pushCloud(); render(); }
function setBudget(catId, val) { data.budgets[catId] = val === "" ? "" : Number(val); pushCloud(); render(); }
function addRecurring(r) { data.recurring.push({ id: uid(), ...r }); pushCloud(); }
function deleteRecurring(id) { data.recurring = data.recurring.filter(r => r.id !== id); pushCloud(); render(); }
function markRecurringPaid(r) {
  addTransaction({ date: todayISO(), amount: r.amount, category: r.category, note: r.name, type: "expense", recurringId: r.id });
  render();
}

  ui.txnDraft = { type: t.type, amount: String(t.amount), category: t.category, note: t.note || "", date: t.date };

}

function setTxnCategory(c) { ui.txnDraft.category = c; render(); }

function txnCanSubmit() { return ui.txnDraft.amount !== "" && Number(ui.txnDraft.amount) > 0; }
function syncTxnSubmitBtn() {
  const btn = document.getElementById("txnSubmitBtn");
  if (btn) btn.disabled = !txnCanSubmit();
}
function submitTxn() {
  if (!txnCanSubmit()) return;
  const payload = {
    type: ui.txnDraft.type,
    amount: Number(ui.txnDraft.amount),
    category: ui.txnDraft.type === "expense" ? ui.txnDraft.category : "other",
    note: ui.txnDraft.note.trim(),
    date: ui.txnDraft.date,
  };
  if (ui.editingTxnId) {
    const idx = data.transactions.findIndex(t => t.id === ui.editingTxnId);
    if (idx !== -1) data.transactions[idx] = { ...data.transactions[idx], ...payload };
    pushCloud();
  } else {
    addTransaction(payload);
  }
  ui.editingTxnId = null;
  ui.showAddTxn = false; render();
}

function openAddRecurring() {
  ui.recurringDraft = { name: "", amount: "", category: data.categories[0].id, day: "1" };

}

              ${budget > 0 ? `
                <div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${over ? "var(--brick)" : c.color}"></div></div>
                <div class="budget-remaining">${fmt(spentC)} of ${fmt(budget)} ${over ? `· ${fmt(spentC-budget)} over` : `· ${fmt(budget-spentC)} left`}</div>
              ` : ""}
            </div>`;
        }).join("")}
      </div>
    `;
  } else if (ui.tab === "recurring") {
    html += `
      <div class="section-title">Standing orders <span class="link" onclick="openAddRecurring()">+ Add</span></div>
      ${upcomingRecurring.length === 0 ? `
        <div class="card"><div class="empty"><div class="empty-title">No recurring bills yet</div><p>Add rent, subscriptions, or anything that repeats monthly.</p></div></div>
      ` : upcomingRecurring.map(r => {
        const paid = isPaidThisRealMonth(r.id);
        const cat = catById(r.category);
        return `
          <div class="recurring-item">
            <div class="recurring-top">
              <div>
                <div class="recurring-name">${esc(r.name)}</div>
                <div class="recurring-due">
                  <span class="tag" style="--tag-color:${cat.color}">${esc(cat.name)}</span>
                  · due ${r.due.toLocaleDateString("en-US",{month:"short",day:"numeric"})}
                </div>
              </div>
              <span class="recurring-amount mono">${fmt(r.amount)}</span>
            </div>
            <div class="recurring-actions">
              <button class="icon-btn" onclick="deleteRecurring('${r.id}')" aria-label="Remove">${ICONS.trash}</button>
              <button class="btn-paid ${paid ? "done" : ""}" ${paid ? "disabled" : `onclick="markRecurringPaid(${JSON.stringify(r).replace(/"/g,'&quot;')})"`}>
                ${ICONS.check}${paid ? "Logged this month" : "Mark paid"}
              </button>
            </div>
          </div>`;
      }).join("")}
    `;
  } else if (ui.tab === "reports") {
    const dailyRows = getDailyReport(monthK);
    const monthlyRows = getMonthlyReport(12, monthK);
    html += `
      <div class="section-title">Reports</div>
      <div class="type-toggle" style="margin-bottom:16px;">
        <button class="${ui.reportView==='daily'?'active expense':''}" onclick="setReportView('daily')">Daily</button>
        <button class="${ui.reportView==='monthly'?'active income':''}" onclick="setReportView('monthly')">Monthly</button>
      </div>
    `;
    if (ui.reportView === "daily") {
      html += `
        <div class="section-title">${esc(monthLabel(monthK))} — day by day</div>
        <div class="card">
          ${dailyRows.length === 0 ? `
            <div class="empty"><div class="empty-title">No entries this month</div><p>Daily totals will show up here as you log expenses.</p></div>
          ` : dailyRows.map(d => `
            <div class="row">
              <span class="row-label">${dayLabel(d.date)}</span>
              <span class="row-leader"></span>
              <span class="row-amount mono" style="color:${d.net < 0 ? 'var(--brick)' : 'var(--forest)'}">${d.net < 0 ? '−' : '+'}${fmt(Math.abs(d.net))}</span>
            </div>
            <div class="daily-sub">Spent ${fmt(d.spent)} · Income ${fmt(d.income)}</div>
          `).join("")}
        </div>
      `;
    } else {
      html += `
        <div class="section-title">Last 12 months</div>
        <div class="card"><div style="width:100%;height:140px;"><canvas id="reportsTrendCanvas"></canvas></div></div>
        <div class="card">
          ${monthlyRows.map(m => `
            <div class="row">
              <span class="row-label">${esc(m.label)}</span>
              <span class="row-leader"></span>
              <span class="row-amount mono" style="color:${m.net < 0 ? 'var(--brick)' : 'var(--forest)'}">${m.net < 0 ? '−' : '+'}${fmt(Math.abs(m.net))}</span>
            </div>
            <div class="daily-sub">Spent ${fmt(m.spent)} · Income ${fmt(m.income)}</div>
          `).join("")}
        </div>
      `;
    }
  }

  html += `</div>

    <button class="fab" onclick="openAddTxn()" aria-label="Add entry">${ICONS.plus}</button>

    <nav class="nav">
      <button class="nav-btn ${ui.tab==='overview'?'active':''}" onclick="setTab('overview')">${ICONS.wallet}<span>Overview</span></button>
      <button class="nav-btn ${ui.tab==='transactions'?'active':''}" onclick="setTab('transactions')">${ICONS.receipt}<span>Ledger</span></button>
      <button class="nav-btn ${ui.tab==='reports'?'active':''}" onclick="setTab('reports')">${ICONS.barChart}<span>Reports</span></button>
      <button class="nav-btn ${ui.tab==='budgets'?'active':''}" onclick="setTab('budgets')">${ICONS.pie}<span>Budgets</span></button>
      <button class="nav-btn ${ui.tab==='recurring'?'active':''}" onclick="setTab('recurring')">${ICONS.repeat}<span>Recurring</span></button>
    </nav>
  `;

  if (ui.showAddTxn) html += addTxnModalHTML();
  if (ui.showAddRecurring) html += addRecurringModalHTML();

  document.getElementById("app").innerHTML = html;

  if (ui.tab === "overview") drawCharts(categorySpend, getTrendData(monthK), income, spent);
  if (ui.tab === "reports" && ui.reportView === "monthly") drawReportsChart(getMonthlyReport(12, monthK));
}

function txnItemHTML(t, deletable) {
  const cat = catById(t.category);
  const dotColor = t.type === "income" ? "#059669" : (cat ? cat.color : "#4A4A44");
  return `
    <div class="txn-item" onclick="openEditTxn('${t.id}')" style="cursor:pointer;">
      <span class="txn-dot" style="background:${dotColor}"></span>
      <div class="txn-main">
        <div class="txn-note">${esc(t.note || (cat ? cat.name : "Expense"))}</div>
        <div class="txn-meta">${cat ? esc(cat.name) : ""} · ${t.date.slice(5)}</div>
      </div>
      <span class="txn-amount mono ${t.type==='income'?'income':'expense'}">${t.type==='income'?'+':'−'}${fmt(t.amount)}</span>
      ${deletable ? `<button class="icon-btn" onclick="event.stopPropagation(); deleteTransaction('${t.id}')" aria-label="Delete entry">${ICONS.trash}</button>` : ""}
    </div>`;
}

function addTxnModalHTML() {
  const d = ui.txnDraft;
  const canSubmit = txnCanSubmit();
  const isEditing = !!ui.editingTxnId;
  return `
    <div class="modal-overlay" onclick="closeAddTxn()">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-head"><span class="modal-title">${isEditing ? "Edit entry" : "New entry"}</span><button class="icon-btn" onclick="closeAddTxn()">${ICONS.x}</button></div>
        <div class="field">
          <div class="type-toggle">
            <button class="${d.type==='expense'?'active expense':''}" onclick="setTxnType('expense')">Expense</button>
            <button class="${d.type==='income'?'active income':''}" onclick="setTxnType('income')">Income</button>
          </div>
        </div>
        <div class="field">
          <label>Amount</label>
          <input class="mono" type="number" inputmode="decimal" placeholder="0" value="${d.amount}" oninput="updateTxnField('amount', this.value)" autofocus />
        </div>
        ${d.type === "expense" ? `
          <div class="field">
            <label>Category</label>
            <div class="cat-grid">
              ${data.categories.map(c => `<div class="cat-chip ${d.category===c.id?'active':''}" onclick="setTxnCategory('${c.id}')">${esc(c.name)}</div>`).join("")}
            </div>
          </div>
        ` : ""}
        <div class="field"><label>Note</label><input type="text" placeholder="Optional" value="${esc(d.note)}" oninput="updateTxnField('note', this.value)" /></div>
        <div class="field"><label>Date</label><input type="date" value="${d.date}" oninput="updateTxnField('date', this.value)" /></div>
        <button id="txnSubmitBtn" class="submit-btn" ${canSubmit?'':'disabled'} onclick="submitTxn()">${isEditing ? "Save changes" : "Save entry"}</button>
      </div>
    </div>`;
}

function addRecurringModalHTML() {
  const d = ui.recurringDraft;
  const canSubmit = recurringCanSubmit();
  return `
    <div class="modal-overlay" onclick="closeAddRecurring()">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-head"><span class="modal-title">New standing order</span><button class="icon-btn" onclick="closeAddRecurring()">${ICONS.x}</button></div>
        <div class="field"><label>Name</label><input type="text" placeholder="Rent, Netflix, gym…" value="${esc(d.name)}" oninput="updateRecurringField('name', this.value)" autofocus /></div>
        <div class="field"><label>Amount</label><input class="mono" type="number" inputmode="decimal" placeholder="0" value="${d.amount}" oninput="updateRecurringField('amount', this.value)" /></div>
        <div class="field">
          <label>Category</label>
          <div class="cat-grid">
            ${data.categories.map(c => `<div class="cat-chip ${d.category===c.id?'active':''}" onclick="setRecurringCategory('${c.id}')">${esc(c.name)}</div>`).join("")}
          </div>
        </div>
        <div class="field"><label>Day of month due (1–28)</label><input type="number" min="1" max="28" value="${d.day}" oninput="updateRecurringField('day', this.value)" /></div>
        <button id="recurringSubmitBtn" class="submit-btn" ${canSubmit?'':'disabled'} onclick="submitRecurring()">Save standing order</button>
      </div>
    </div>`;
}

function drawCharts(categorySpend, trendData, income, spent) {
  if (typeof Chart === "undefined") return; // Chart.js failed to load (e.g. offline) — skip charts gracefully
  if (donutChart) { donutChart.destroy(); donutChart = null; }
  if (trendChart) { trendChart.destroy(); trendChart = null; }
  if (splitChart) { splitChart.destroy(); splitChart = null; }

  const splitEl = document.getElementById("splitCanvas");
  const splitData = [
    { name: "Income", value: income, color: "#059669" },
    { name: "Expense", value: spent, color: "#DC2626" },
  ].filter(s => s.value > 0);
  if (splitEl && splitData.length) {
    splitChart = new Chart(splitEl, {
      type: "doughnut",
      data: { labels: splitData.map(s=>s.name), datasets: [{ data: splitData.map(s=>s.value), backgroundColor: splitData.map(s=>s.color), borderWidth: 0 }] },
      options: { cutout: "62%", plugins: { legend: { display: false }, tooltip: { enabled: false } }, animation: false }
    });
  }

  const donutEl = document.getElementById("donutCanvas");
  if (donutEl && categorySpend.length) {
    donutChart = new Chart(donutEl, {
      type: "doughnut",
      data: { labels: categorySpend.map(c=>c.name), datasets: [{ data: categorySpend.map(c=>c.value), backgroundColor: categorySpend.map(c=>c.color), borderWidth: 0 }] },
      options: { cutout: "62%", plugins: { legend: { display: false }, tooltip: { enabled: false } }, animation: false }
    });
  }
  const trendEl = document.getElementById("trendCanvas");
  if (trendEl) {
    trendChart = new Chart(trendEl, {
      type: "bar",
      data: { labels: trendData.map(t=>t.month), datasets: [{ data: trendData.map(t=>t.total), backgroundColor: "#DC2626", borderRadius: 3 }] },
      options: {
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx)=>fmt(ctx.parsed.y) } } },
        scales: { y: { display: false }, x: { grid: { display: false }, ticks: { color: "#6B6656", font: { size: 11 } } } },
        animation: false
      }
    });
  }
}

function drawReportsChart(monthlyRows) {
  if (typeof Chart === "undefined") return;
  if (reportsChart) { reportsChart.destroy(); reportsChart = null; }
  const el = document.getElementById("reportsTrendCanvas");
  if (!el) return;
  const rows = [...monthlyRows].reverse(); // oldest to newest, left to right
  reportsChart = new Chart(el, {
    type: "bar",
    data: {
      labels: rows.map(r => r.short),
      datasets: [
        { label: "Income", data: rows.map(r => r.income), backgroundColor: "#059669", borderRadius: 3 },
        { label: "Expense", data: rows.map(r => r.spent), backgroundColor: "#DC2626", borderRadius: 3 },
      ],
    },
    options: {
      plugins: {
        legend: { display: true, position: "top", labels: { boxWidth: 8, font: { size: 11 }, color: "#4B4A3F" } },
        tooltip: { callbacks: { label: (ctx) => `${ctx.dataset.label}: ${fmt(ctx.parsed.y)}` } },
      },
      scales: {
        y: { display: false },
        x: { grid: { display: false }, ticks: { color: "#6B6656", font: { size: 10 } } },
      },
      animation: false,
    },
  });
}
